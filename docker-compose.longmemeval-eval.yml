name: jchatmind-longmemeval-eval

services:
  postgres:
    build:
      context: ./docker/postgres
    image: jchatmind-longmemeval-eval-postgres-vchord-bm25:0.3.0
    container_name: jchatmind-longmemeval-eval-postgres
    environment:
      POSTGRES_DB: longmemeval_eval
      POSTGRES_USER: longmemeval_eval
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - longmemeval_eval_postgres_data:/var/lib/postgresql/data
      - ./longmemeval-eval/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U longmemeval_eval -d longmemeval_eval"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: "no"

volumes:
  longmemeval_eval_postgres_data:
