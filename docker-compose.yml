services:
  postgres:
    build:
      context: ./docker/postgres
    image: jchatmind-postgres-vchord-bm25:0.3.0
    container_name: jchatmind-postgres
    environment:
      POSTGRES_DB: jchatmind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: jchatmind-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: jchatmind-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  ollama:
    build:
      context: ./docker/ollama
    container_name: jchatmind-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference@sha256:ad950d30878eceb72aaf32024d26fa2b1d04a75304fa0b4776b49aa1941fea07
    container_name: jchatmind-reranker
    command: ["--model-id", "BAAI/bge-reranker-v2-m3"]
    ports:
      - "8081:80"
    volumes:
      - tei_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
    external: true
    name: jchatmind_postgres_data
  ollama_data:
    name: jchatmind_ollama_data
  tei_data:
    name: jchatmind_tei_data
